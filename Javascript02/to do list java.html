<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
</head>
<body>
    <h2>To-Do List</h2>
    <input type="text" id="todoInput" placeholder="Tulis tugas...">
    <button onclick="tambahTugas()">Tambah</button>

    <ul id="todoList">
        <li>Mengerjakan latihan 1</li>
        <li>Membuat laporan</li>
    </ul>

    <script>
        function tambahTugas() {
            var input = document.getElementById("todoInput");
            var tugasBaru = input.value;

            if (tugasBaru.trim() !== "") {
                var ul = document.getElementById("todoList");
                var li = document.createElement("li");
                 li.appendChild(document.createTextNode(tugasBaru));
                ul.appendChild(li);
                input.value = "";
            }
        }
    </script>
</body>
</html>
